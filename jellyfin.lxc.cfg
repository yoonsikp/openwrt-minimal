# Template used to create this container: /usr/share/lxc/templates/lxc-download
# Parameters passed to the template: -d debian -r trixie -a amd64
# Template script checksum (SHA-1): 03fb81097232bec4cce926d6d5a0ebca44a52db1
# For additional config options, please look at lxc.container.conf(5)

# Uncomment the following line to support nesting containers:
#lxc.include = /usr/share/lxc/config/nesting.conf
# (Be aware this has security implications)

# security.nesting = true

# Distribution configuration
lxc.include = /usr/share/lxc/config/common.conf
lxc.arch = linux64

# Container specific configuration
lxc.rootfs.path = dir:/srv/lxc/jellyfin/rootfs
lxc.uts.name = jellyfin

# Network configuration
lxc.net.0.type = veth
lxc.net.0.link = br-lan
lxc.net.0.flags = up
lxc.net.0.hwaddr = 10:66:6a:51:79:23


lxc.cgroup2.devices.allow = c 226:0 rwm
lxc.cgroup2.devices.allow = c 226:128 rwm

# Bind mount the devices into the container
lxc.mount.entry = /dev/dri dev/dri none bind,optional,create=dir
lxc.mount.entry = /mnt/media mnt/media none bind,create=dir

lxc.cgroup2.devices.allow = c 10:200 rwm
lxc.mount.entry = /dev/net/tun dev/net/tun none bind,create=file

#lxc.cgroup2.devices.allow = c 10:223 rwm
#lxc.mount.entry = /dev/uinput dev/uinput none bind,optional,create=file

lxc.cgroup2.devices.allow = c 13:* rwm
lxc.mount.entry = /dev/input dev/input none bind,optional,create=dir

# Allow the container to use the character device
#lxc.cgroup2.devices.allow = c 29:* rwm
#lxc.mount.entry = /dev/fb0 dev/fb0 none bind,optional,create=file

# Bind mount the sound device directory
lxc.cgroup2.devices.allow = c 116:* rwm
lxc.mount.entry = /dev/snd dev/snd none bind,optional,create=dir

lxc.cgroup2.devices.allow = c 4:0 rwm
lxc.mount.entry = /dev/tty0 dev/tty0 none bind,optional,create=file

#lxc.mount.entry = /sys sys none bind,optional,create=dir,ro

